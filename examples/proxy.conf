# Literal KEY=value settings; change these example domains before applying.
# Check settings: bash install.sh install --config examples/proxy.conf --dry-run
MODE=all
EE_DOMAIN=ee.example.com
DD_DOMAIN=dd.example.com
FRONT_DOMAIN=www.cloudflare.com
EE_PORT=443
DD_PORT=8443
EE_BIND_IP=0.0.0.0
DD_BIND_IP=0.0.0.0
EE_BIND_IPV6=
DD_BIND_IPV6=
# Set public addresses when the server is behind NAT.
PUBLIC_IPV4=
PUBLIC_IPV6=
ENABLE_BBR=no
FIREWALL_POLICY=keep
